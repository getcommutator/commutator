[package]
name = "commutator"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shared by both binaries.
[lib]
name = "commutator_app"
path = "src/lib.rs"

[[bin]]
name = "commutator"
path = "src/main.rs"

[[bin]]
name = "commutator-engine"
path = "src/bin/commutator-engine.rs"

# `ui`: the desktop window. A server's build leaves it out (`--no-default-features`):
# no GPUI, so no X11/Wayland libraries to build with or to run.
[features]
default = ["ui"]
ui = ["dep:commutator-ui"]

[dependencies]
commutator-engine.workspace = true
commutator-rpc.workspace = true
commutator-update.workspace = true
commutator-cli.workspace = true
commutator-mcp.workspace = true
commutator-notify.workspace = true
commutator-sync.workspace = true
commutator-ui = { workspace = true, optional = true }
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true
# mimalloc's options (`mi_option_set`): the heap's VM tag (src/allocator.rs).
# The same libmimalloc-sys mimalloc links (v2 comes from the workspace's
# mimalloc feature).
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
