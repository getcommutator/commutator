[package]
name = "commutator-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The device-room frame codec and token generator the engine speaks.
commutator-rpc.workspace = true
commutator-account.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
# http2: APNs speaks nothing else.
reqwest = { workspace = true, features = ["http2"] }
# ES256 for the APNs provider token (already in the tree through rustls).
ring = "0.17"
sha2.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 0.7: its `ws` rides tokio-tungstenite 0.24, the one the workspace already has.
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"

[dev-dependencies]
tempfile.workspace = true
async-trait.workspace = true
tokio-tungstenite.workspace = true
# The other end of preview signaling, for the WebRTC test (tests/signaling.rs).
commutator-preview.workspace = true
tokio-util.workspace = true
