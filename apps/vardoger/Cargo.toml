[package]
name = "vardoger"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shared by both binaries.
[lib]
name = "vardoger_app"
path = "src/lib.rs"

[[bin]]
name = "vardoger"
path = "src/main.rs"

[[bin]]
name = "vardoger-engine"
path = "src/bin/vardoger-engine.rs"

[dependencies]
vardoger-engine.workspace = true
vardoger-rpc.workspace = true
vardoger-update.workspace = true
vardoger-cli.workspace = true
vardoger-mcp.workspace = true
vardoger-notify.workspace = true
vardoger-sync.workspace = true
vardoger-ui.workspace = true
tokio.workspace = true
clap.workspace = true
anyhow.workspace = true
libc.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The custom allocator is macOS-only (see main.rs): glibc measured flat on the
# same streaming/scroll workloads, so Linux keeps the system allocator.
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc.workspace = true
# mimalloc's options (`mi_option_set`): the heap's VM tag (src/allocator.rs).
# The same libmimalloc-sys mimalloc links (v2 comes from the workspace's
# mimalloc feature).
libmimalloc-sys = { version = "0.1.49", features = ["extended"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-resource = "3.0.11"
