collections = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
derive_refineable = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_linux = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_macos = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_macros = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_platform = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_shared_string = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_tokio = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_util = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_web = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_wgpu = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
gpui_windows = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
http_client = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
media = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
perf = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
refineable = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
scheduler = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
sum_tree = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
util_macros = { git = "https://github.com/freethinkel/zui", rev = "38b9e0f47d28a90da3bfa01d3827c8685f660b89" }
