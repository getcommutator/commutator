[workspace]
resolver = "2"
members = [
    "apps/commutator",
    "apps/commutator-server",
    "crates/account",
    "crates/cli",
    "crates/client",
    "crates/doc",
    "crates/engine",
    "crates/harness",
    "crates/launch",
    "crates/markdown",
    "crates/mcp",
    "crates/mobile",
    "crates/mobile-bindgen",
    "crates/notify",
    "crates/preview",
    "crates/preview-label",
    "crates/proto",
    "crates/rpc",
    "crates/sync",
    "crates/syntax",
    "crates/term",
    "crates/term-link",
    "crates/theme",
    "crates/ui",
    "crates/text",
    "crates/update",
    "crates/veil",
    "crates/visual",
    "crates/visual-gpu",
    "crates/zatex",
]

[workspace.package]
version = "0.3.16"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
commutator-term-link = { path = "crates/term-link" }
commutator-proto = { path = "crates/proto" }
commutator-preview = { path = "crates/preview" }
commutator-preview-label = { path = "crates/preview-label" }
commutator-doc = { path = "crates/doc" }
commutator-sync = { path = "crates/sync" }
commutator-harness = { path = "crates/harness" }
commutator-engine = { path = "crates/engine" }
commutator-rpc = { path = "crates/rpc" }
commutator-update = { path = "crates/update" }
commutator-cli = { path = "crates/cli" }
commutator-launch = { path = "crates/launch" }
commutator-notify = { path = "crates/notify" }
commutator-mcp = { path = "crates/mcp" }
commutator-visual = { path = "crates/visual" }
commutator-client = { path = "crates/client" }
commutator-markdown = { path = "crates/markdown" }
commutator-syntax = { path = "crates/syntax" }
commutator-text = { path = "crates/text" }
commutator-account = { path = "crates/account" }
commutator-term = { path = "crates/term" }
commutator-theme = { path = "crates/theme" }
commutator-veil = { path = "crates/veil" }
commutator-ui = { path = "crates/ui" }
commutator-visual-gpu = { path = "crates/visual-gpu" }
zatex = { path = "crates/zatex" }

# gpui: zeronsh/zui, patched below to the freethinkel/zui fork (the same rev
# Shepherd uses, so both apps run one gpui).
gpui = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda" }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda", features = [
    "wayland",
    "x11",
    "font-kit",
    "runtime_shaders",
] }
gpui_tokio = { git = "https://github.com/zeronsh/zui", rev = "18a89af04cfe079d55275b111ac349d5640d9cda" }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "103f13da91ff2c7c52941bdc2b1910f29716dc19" }

# CRDT
loro = "1.17"
# Wire protocol for the SessionRoom DO rooms — official Rust twin of the npm
# `loro-protocol` package the TS edge speaks (same monorepo, byte-identical
# frames, cross-checked by its js_snapshots tests).
loro-protocol = "0.3"

# diffs
similar = "2"

# async / net
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
libc = "0.2"
gethostname = "1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
# antigravity writes `settings.json` but reads it back with `hjson.load`, so a
# user's comments and unquoted keys have to survive our read of the same file.
deser-hjson = "2.2"
plist = "1"
uuid = { version = "1", features = ["v4", "serde"] }

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# misc
# Global allocator on macOS only: libmalloc retains the churn high-water mark
# as permanent RSS - measured as the top residency cause in
# docs/memory-plan.md. Pinned to mimalloc v2: the crate's default (v3.3.2)
# has the same watermark pathology itself - transient streaming/render churn
# became permanent RSS (~6x glibc growth, daemon at 908MB for 7.3MB of docs,
# no idle recovery). Linux stays on glibc, which measured flat on the same
# workloads.
mimalloc = { version = "0.1", features = ["v2"] }
anyhow = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
zip = { version = "7.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
notify = "7"
portable-pty = "0.8"
alacritty_terminal = "0.26"
pulldown-cmark = "0.12"
unicode-segmentation = "1"
unicode-width = "0.2"
fontdb = "0.23"
ttf-parser = "0.25.1"
# Packaged GUI apps do not inherit shell proxy variables; honor the macOS and
# Windows system proxy for provider usage probes and other HTTP clients.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "system-proxy"] }
ignore = "0.4"
# Workspace file/content search index (@ mentions, file tree, cmd+K).
# Pinned exactly: crates.io also carries `0.11.1-nightly.*` prereleases.
fff-search = "=0.11.0"

[profile.release]
# Distribution profile (scripts/package-linux.sh): thin LTO buys most of fat
# LTO's size/speed win at a fraction of the link time; strip debug symbols.
# scripts/package-linux.sh builds the Linux release with fat LTO in one codegen
# unit instead (16% smaller, which Cloud wakes copy back in).
lto = "thin"
strip = "symbols"

[profile.dev]
# Our own crates unoptimized for quick rebuilds; dependencies optimized below.
opt-level = 0
# Full DWARF was ~90% of every rlib (25 GB of target/debug/deps). Line tables
# keep file:line in panics and backtraces; for locals in lldb, build with
# `--profile dev-debug`.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# `cargo build --profile dev-debug`: dev with full debug info, for lldb.
# Builds into target/dev-debug.
[profile.dev-debug]
inherits = "dev"
debug = true

[profile.dev-debug.package."*"]
debug = true

# Scenes rasterize in software every frame the camera moves.
[profile.dev.package.commutator-visual]
opt-level = 3

[profile.dev.package.commutator-visual-gpu]
opt-level = 3

# Mobile core (scripts/ios/build-core.sh). Always optimized — layout and sync
# run on the phone's hot paths, so even Debug app builds link an -O core.
[profile.mobile]
inherits = "release"
lto = false
strip = false
debug = "line-tables-only"
incremental = false
codegen-units = 16

# TestFlight/App Store archives.
[profile.mobile-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# freethinkel/zui: every zui crate is patched, so gpui-base and the UI share one gpui.
