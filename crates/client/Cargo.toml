[package]
name = "commutator-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The engine-free thin client ("viewer device"): one engine's registry and
# chats mirrored over its JSON-RPC (local IPC, or the account server's relay),
# plus a fully offline Demo mode. Pure Rust — a UniFFI facade goes on top, so
# this crate stays usable from any frontend (iOS, Android, tests, CLIs).

[dependencies]
commutator-proto.workspace = true
commutator-doc.workspace = true
commutator-sync.workspace = true
commutator-rpc.workspace = true
commutator-term-link.workspace = true
# WebRTC to the account's machines in Remote mode: terminals go direct when
# they can, previews open over it (src/direct.rs).
commutator-preview.workspace = true
anyhow.workspace = true
loro.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true
# A real engine in-process for the local-mode test (tests/local.rs).
commutator-engine.workspace = true
commutator-visual.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# The account server in-process for the remote-mode test (tests/remote.rs);
# axum 0.7 is the server's own, already in the lockfile.
commutator-server = { path = "../../apps/commutator-server" }
axum = "0.7"

