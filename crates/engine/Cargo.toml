[package]
name = "vardoger-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vardoger-launch.workspace = true
# Host-side answers to terminal queries (terminals/replies.rs).
alacritty_terminal.workspace = true
vardoger-preview.workspace = true
vardoger-proto.workspace = true
vardoger-doc.workspace = true
vardoger-sync.workspace = true
vardoger-harness.workspace = true
semver = "1"
vardoger-rpc.workspace = true
vardoger-update.workspace = true
vardoger-notify.workspace = true
vardoger-visual.workspace = true
loro.workspace = true
tokio.workspace = true
futures.workspace = true
vardoger-term-link.workspace = true
async-trait.workspace = true
# Agents' Vardoger MCP tools, served by the engine itself (`vardoger_mcp::http`).
vardoger-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
notify.workspace = true
portable-pty.workspace = true
base64 = "0.22"
# Cloud runner identity: Ed25519 device key (already in the tree via rustls).
ring = "0.17"
toml = "0.8"
libc.workspace = true
gethostname.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
sha2.workspace = true
reqwest.workspace = true
# A large chat2 checkpoint sent in parts, sliced from one buffer.
bytes = "1"
ignore.workspace = true
fff-search.workspace = true

same-file = "1"
tempfile.workspace = true
# `show_image` reads a shown image's size from its header (already in the
# tree with these decoders via vardoger-ui).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# `DeviceStats` (device_stats.rs): OS, CPU, memory and volumes from OS APIs.
# Already in the tree (zed-scap, through the app); only its system and disk
# parts here, no threads pool.
sysinfo = { version = "0.31.4", default-features = false, features = ["system", "disk"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The battery's IOKit power-source dictionary (device_stats.rs); already in the tree.
core-foundation = "0.10"

[target.'cfg(windows)'.dependencies]
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Threading"] }

[dev-dependencies]
tracing-subscriber.workspace = true
vardoger-harness = { workspace = true, features = ["installer-fixture"] }
# Paused-clock tests (the 30-minute idle reaper).
tokio = { workspace = true, features = ["test-util"] }
zip.workspace = true
tokio-tungstenite.workspace = true
# A registry build of the fake ACP agent (tests/acp_registry_rpc.rs).
tar = "0.4"
flate2 = "1"
# In-process registry server for the two-engine workspace integration tests.
vardoger-sync = { workspace = true, features = ["mock-server"] }
