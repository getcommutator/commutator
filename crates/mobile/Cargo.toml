[package]
name = "vardoger-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "vardoger_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
vardoger-voice-session.workspace = true
vardoger-orb.workspace = true
vardoger-veil.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
vardoger-markdown.workspace = true
vardoger-text.workspace = true
vardoger-visual.workspace = true
vardoger-visual-gpu.workspace = true
vardoger-doc.workspace = true
vardoger-proto.workspace = true
vardoger-client.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
vardoger-syntax.workspace = true
zatex = { workspace = true, features = ["bundled"] }
thiserror.workspace = true
vardoger-term.workspace = true
