[package]
name = "commutator-mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The mobile core: one UniFFI library that iOS (Swift) and Android (Kotlin)
# link. Platform code paints, scrolls and handles gestures; everything that
# decides *what* to paint and *where* lives here.
[lib]
name = "commutator_mobile"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
uniffi = "0.32"
commutator-markdown.workspace = true
commutator-text.workspace = true
commutator-visual.workspace = true
commutator-visual-gpu.workspace = true
commutator-doc.workspace = true
commutator-proto.workspace = true
commutator-rpc.workspace = true
commutator-client.workspace = true
commutator-account.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
commutator-syntax.workspace = true
zatex = { workspace = true, features = ["bundled"] }
thiserror.workspace = true
commutator-term.workspace = true
