[package]
name = "commutator-term"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The terminal emulator core without a renderer — alacritty's Term + vte as a
# pure state machine, plus local echo prediction. The desktop panel and the
# mobile core both paint it.
[dependencies]
alacritty_terminal.workspace = true

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# kitty-graphics: the protocol's image storage; png: the Rust PNG decoder
# the storage needs for PNG-transmitted images.
ghostty-vt = { version = "=0.7.0", default-features = false, features = [
    "kitty-graphics",
    "png",
] }
